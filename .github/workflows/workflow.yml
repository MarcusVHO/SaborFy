name: Contínuos Integration
on:
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    name:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw -Dtest='User*Test' test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Login docker hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build Docker Image
        run: |
          docker build -t marcusxyz5/saborfy:latest .

      - name: Push in Image
        run: |
          docker push marcusxyz5/saborfy:latest

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build
      - test

    steps:
      - name: Deploy in server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USERNAME}}
          key: ${{secrets.SERVER_SSH_KEY}}
          script: |
            docker pull marcusxyz5/saborfy:latest
            docker stop saborfy
            docker rm -f saborfy 2>/dev/null || true
            docker run -d \
              --name saborfy \
              -p 8085:8080 \
              -e DB_HOST=${{secrets.DB_HOST}} \
              -e DB_PORT='${{secrets.DB_PORT}}' \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e DB_DATABASE=${{secrets.DB_DATABASE}} \
              -e DB_USERNAME=${{secrets.DB_USERNAME}} \
              -e DB_PASSWORD=${{secrets.DB_PASSWORD}} \
              -e TOKEN_SECRET=${{secrets.TOKEN_SECRET}} \
              marcusxyz5/saborfy:latest

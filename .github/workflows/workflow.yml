name: Contínuos Integration
on:
  pull_request:
    branches:
      - master
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Login docker hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWOD}}

      - name: Build Docker Image
        run: |
          docker build -t marcusxyz5/saborfy:latest .

      - name: Push in Image
        run: |
          docker push marcusxyz5/saborfy:latest

      - name: Deploy in server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USERNAME}}
          key: ${{secrets.SERVER_SSH_KEY}}
          script: |
            docker pull marcusxyz5/saborfy:latest
            docker stop saborfy
            docker run -d \
              --name saborfy
              -p 8085:8080
              -e DB_HOST=${{secrets.DB_HOST}}
              -e DB_POR=${{secrets.DB_PORT}}
              -e DB_DATABASE=${{secrets.DB_DATABASE}}
              -e DB_USERNAME=${{secrets.DB_USERNAME}}
              -e DB_PASSWORD=${{secrets.DB_PASSWORD}}
              -e TOKEN_SECRET=${{secrets.TOKEN_SECRET}}
              marcusxyz5/saborfy:latest

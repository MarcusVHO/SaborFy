spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    com.marcus.template: INFO
    org.springframework.security: WARN

app:
  jwt:
    secret: ${TOKEN_SECRET}

